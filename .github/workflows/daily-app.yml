name: Daily App Generator

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour (UTC); automate.py rolls 1-in-24
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the 1-in-24 roll and build an app now"
        type: boolean
        default: true
      category:
        description: "Category for this run"
        type: choice
        options: [auto, problem-solving, design, utility]
        default: auto
      skip_linkedin:
        description: "Don't post this one to LinkedIn"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-app-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install headless Chromium (for screenshots)
        run: python -m playwright install --with-deps chromium

      - name: Run generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: main
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          LINKEDIN_VISIBILITY: ${{ vars.LINKEDIN_VISIBILITY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          FORCE_CATEGORY: ${{ inputs.category }}
          SKIP_LINKEDIN: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_linkedin }}
        run: python automate.py
